name: iOS Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-14  # Plus stable que macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Show environment
        run: |
          echo "Xcode version:"
          xcodebuild -version
          echo "\nAvailable simulators:"
          xcrun simctl list devices available | grep "iPhone"
      
      - name: Install dependencies
        run: |
          # Si vous utilisez CocoaPods
          if [ -f Podfile ]; then
            echo "Installing CocoaPods dependencies..."
            sudo gem install cocoapods
            pod install
          fi
          
          # Installer xcbeautify
          brew install xcbeautify
      
      - name: Run tests
        run: |
          set -o pipefail
          
          # Choisir la bonne commande selon votre projet
          
          # Si vous avez un .xcworkspace :
          xcodebuild test \
            -project EPCollaboratif.xcodeproj \
            -scheme EPCollaboratif \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=Any iOS Device' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
      
      - name: Upload test results
        uses: kishikawakatsumi/xcresulttool@v1
        with:
          path: TestResults.xcresult
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Xcode test results
        if: always()  # Toujours uploader, même si les tests échouent